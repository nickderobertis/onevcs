schema_version: 1
budgets:
  # Basis: estimate. Measurement source: direct. Check runtime: about 600 seconds,
  # because the measurement builds this repository's test targets twice.
  - id: onevcs-pool-maintenance-seconds
    labels: [host]
    measure: reported
    command: [./measure.sh]
    unit: seconds
    direction: max
    threshold: 20
    description: >-
      Wall-clock seconds one steady-state pass of this repository's declared pool
      maintenance takes over one ordinary run's worth of superseded builds, as
      cargo-prune-superseded reports it; how long a regular post-run pass holds one
      of this repository's warm slots out of service. Detail reports entries walked,
      profile directories, builds removed, bytes freed, walking and removing seconds,
      and, never counted in the figure, the untimed backlog pass's seconds.
