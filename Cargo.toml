# The Cargo workspace. One member today (`crates/onevcs`, the published crate and
# its binary); the workspace exists because the contract's seams — a second host
# implementation, an events reader — are expected to arrive as their own crates,
# and retrofitting a workspace later moves every path in the tree.
#
# Shared metadata lives in `[workspace.package]` and shared version requirements
# in `[workspace.dependencies]`, so a member never pins its own copy of either.
# The published *version* is deliberately NOT inherited: release-plz maintains it
# in the member manifest, which is the one place `scripts/npm-build.mjs` and
# maturin read it from.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Nick DeRobertis"]
repository = "https://github.com/nickderobertis/onevcs"
homepage = "https://github.com/nickderobertis/onevcs"

[workspace.dependencies]
dunce = "1.0.5"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, so an envelope
# re-serializes in the field order docs/contract.md declares rather than in
# whatever order a hash map happened to yield.
serde_json = { version = "1", features = ["preserve_order"] }
# The maintained fork of serde_yaml, which its author archived. The rules file is
# YAML, so the crate needs a YAML reader; this one is the drop-in that is still
# receiving fixes (and does not trip `cargo deny`'s unmaintained advisory).
serde_yaml_ng = "0.10"
thiserror = "2"
# A change request's URL is parsed at the boundary rather than carried as a
# string, so an unparseable one is rejected where it enters.
url = { version = "2", features = ["serde"] }
# Process-shared advisory file locks. The registry, the occupancy leases, and the
# merge queue are coordinated between separate `onevcs` processes, and the OS lock
# is the only one of those that survives a holder being killed. Cross-platform so
# the coordination is not a Unix-only feature of the same binary.
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# A filesystem of this journey suite's own, so one boundary a sweep has to answer for
# — a directory that takes an entry and will not give it up — can be a real mount
# rather than something stood in for. Built without libfuse: the pure-Rust mount goes
# through `fusermount3`, so a clean clone needs the `fuse3` package and no headers.
# `default-features = false` is stated rather than relied on being the default — the
# crate's `libfuse` feature is additive, and a dependency that turned it on would
# link headers a clean clone does not have. The floor is 0.16 because RUSTSEC-2021-0154
# is unsound below it; this takes the newest, which is where the fix has stayed.
fuser = { version = "0.18", default-features = false }
# Setting a directory's timestamps, which `std` can only do through a handle it has
# no portable way to open one with — Windows hands a directory back on no terms but
# the backup semantics, and a `#[cfg]` for that would be a second implementation of
# the sweep's probe on the one platform its journeys cannot run.
filetime = "0.2"
# A lock file is named by a digest of the identity it guards, because that identity
# is a filesystem path and a path is not a filename.
sha2 = "0.10"
# The envelope's `ts` is RFC3339 with millisecond precision in UTC. Civil-calendar
# arithmetic is not a thing to hand-roll into an event stream's ordering key.
time = { version = "0.3", features = ["formatting", "macros"] }
# Unicode's own general-category table, which is what decides whether a character
# a repository's hook wrote renders as anything. Already in the graph behind
# `url`'s IDNA tables, so asking it directly rather than keeping a copy of the
# category here costs no crate, no data, and no fetch.
icu_properties = "2.2"
# Terminating a timed-out git takes its whole process group, and that call has no
# portable spelling. Depended on for Unix only; Windows gets the bound without the
# group teardown.
libc = "0.2"

assert_cmd = "2"
predicates = "3"
tempfile = "3"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
