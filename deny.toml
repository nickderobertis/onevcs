# cargo-deny policy. Strict by default: advisories, licenses, bans, and sources
# all fail the check rather than warn. Any exception below is explicit and carries
# a reason so the policy never silently accumulates debt. Run via `just deps-check`
# and a dedicated CI job (it needs a network advisory DB), not the core `just
# check` gate.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this MIT-licensed binary. Adding a
# dependency with a new license fails the check until it is reviewed and added.
# Kept to exactly what the current graph uses, so the list stays a reviewed record
# rather than a wish list — cargo-deny warns about allowances it never encounters,
# and that noise is how an unreviewed license slips in unnoticed.
allow = [
    "MIT",
    "Apache-2.0",
    # Unicode's tables: `icu_properties`, which answers whether a character a
    # repository's hook wrote renders as anything, and the IDNA data behind `url`,
    # which parses a change request's URL.
    "Unicode-3.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# …except for a path dependency inside this workspace, which is how the one
# dependency cycle here is spelled: `onevcs` dev-depends on `onevcs-testing`, which
# depends on `onevcs`, so that one publication journey can run against both
# backends and the two event streams be held to each other. A dev-dependency with
# no version requirement is the spelling Cargo strips when publishing — giving it
# one would make each crate's release wait on the other's. An external wildcard is
# still refused; this narrows to `{ path = ... }`.
allow-wildcard-paths = true
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
