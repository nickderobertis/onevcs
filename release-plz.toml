# Automated releases from conventional commits, driven by release-plz.
#
# Flow:
#   1. Commits land on `main` (pre-1.0: feat -> minor, fix/perf/refactor/build ->
#      patch, `!`/BREAKING -> minor; chore/docs/ci/test/style do not release).
#      release-plz only *sees* a commit that touched the crate's packaged files,
#      so what releases is governed by `[package] include` in
#      crates/onevcs/Cargo.toml. See AGENTS.md.
#   2. The `release-pr` job opens/updates a PR that bumps the version in
#      Cargo.toml + Cargo.lock and writes the CHANGELOG section.
#   3. Merging that PR makes the `release` job tag `vX.Y.Z` and cut a GitHub
#      Release with the changelog notes. That Release (created with a PAT, not the
#      default GITHUB_TOKEN) triggers release.yml, which builds and publishes the
#      binaries, the wheels, and the npm packages.

[workspace]
# release-plz only versions, changelogs, tags, and cuts the GitHub Release — it
# never runs `cargo publish`. crates.io publishing is a separate step: the
# `publish-crate` job in release.yml, which self-activates when the
# CARGO_REGISTRY_TOKEN secret is set. Keeping it out of release-plz decouples
# versioning/tagging from the registry push.
publish = false

# API breaking-change detection (cargo-semver-checks) needs an extra tool and
# would block releases on any surface change; rely on review and the
# conventional-commit type instead (a `!` or `BREAKING CHANGE:` still bumps).
semver_check = false

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Keep-a-Changelog-style grouping. The version bump is computed from the
# conventional-commit *type*, independent of these display groups.
[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { body = ".*", group = "Other" },
]

# The changelog lives at the repository root, not beside the crate's Cargo.toml
# where release-plz would otherwise write it. Two things read it there: the
# release archive's `include` in release.yml, whose paths resolve from the
# checkout root — a root changelog is what keeps that step from failing every
# upload leg with `cp: cannot stat 'CHANGELOG.md'` — and a reader arriving at the
# repository, who looks in one place. It is also the shape the sibling repos
# have, so that workflow line stays literally identical across all of them.
#
# `changelog_path` can only be set per package, and is itself relative to the
# root Cargo.toml, so this whole table exists to move that one file.
[[package]]
name = "onevcs"
changelog_path = "CHANGELOG.md"

# The second published crate: the test implementations of this crate's two
# interfaces, which a consumer puts in `dev-dependencies`. It is versioned and
# changelogged on its own, because it is its own deliverable and a change to a
# test provider must not bump the CLI everyone installs.
#
# Two settings, both load-bearing. Its tag is prefixed, because `git_tag_name`
# above is one template for the whole workspace and two packages cutting `vX.Y.Z`
# would collide on the first release that moved both. And it cuts no GitHub
# Release, because a Release is what triggers release.yml to build and publish the
# binaries, the wheels, and the npm packages — all of which are the *CLI*, and none
# of which this crate has.
[[package]]
name = "onevcs-testing"
git_tag_name = "onevcs-testing-v{{ version }}"
git_release_enable = false
