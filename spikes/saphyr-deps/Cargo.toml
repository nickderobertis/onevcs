# Only serde-saphyr and saphyr, so `cargo deny` and `cargo tree` see exactly what
# those two crates bring in (spike-onevcs-yaml; never lands).
[package]
name = "saphyr-deps"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
serde-saphyr = "=1.3.0"
saphyr = { version = "=0.2.1", default-features = false }

# saphyr's one default feature, `encoding`, behind a switch of this crate's own, so
# `cargo tree --no-default-features` shows saphyr without it.
[features]
default = ["saphyr-encoding"]
saphyr-encoding = ["saphyr/encoding"]
