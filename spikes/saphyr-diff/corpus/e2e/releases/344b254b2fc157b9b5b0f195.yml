version: 1
default:
  adoption: fast
repositories:
  - match: {path: "/tmp/.tmpFWz1xF/project"}
    adoption: published
    default_target: crate
    targets:
      - name: crate
        style: automated
        probe:
          shell: 'cat "$HOME/answers/crate"'
          timeout_seconds: 20
      - name: wheel
        style: automated
        probe:
          shell: 'cat "$HOME/answers/wheel"'
          timeout_seconds: 20
