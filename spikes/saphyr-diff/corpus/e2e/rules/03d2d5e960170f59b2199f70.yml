# Installed by `onevcs rules apply`. Edit the base and overlays it was composed from, and apply them again.
version: 4
rules:
- match:
    owner: someone-else
  publication: change-direct
  approvals: none
- match:
    host: github.com
    owner: sample-owner
  publication: change-auto
  approvals: none
default:
  publication: change-open
  approvals: required
