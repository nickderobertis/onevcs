# llmlint: ignore-file[crates_stay_in_one_cargo_workspace,new_command_or_client_gets_its_own_project] this measurement code lives only on the preserved spike branch, which the plan's run discards once it succeeds (orchestration.md, Spikes), and is never merged into the repository's tree; a workspace member or an Nx project would put it into every check of main.
