name: Published smoke

# Install what the registries are serving *right now* and run it.
#
# `release.yml`'s verify jobs prove a version at the moment it is published, and
# then never look again. Everything that can break afterwards — a yanked platform
# package, an npm dist-tag moved to a build that never shipped, a wheel PyPI
# stopped serving for one platform — is invisible until a user hits it, because
# nothing else in this repository installs from a registry between releases.
#
# So this runs the identical `scripts/smoke-published.sh` those jobs run, against
# `latest` rather than a tag, on Linux, both macOS architectures, and Windows,
# every time `release.yml` finishes. The registry's own idea of the version (`pip
# show`, `npm view`) is what the binary is held to, so a package whose metadata
# and payload disagree fails here rather than confusing someone reading
# `--version`.
#
# The third install surface is `cargo install onevcs`, which resolves from
# crates.io and is proven on all three platforms by ci.yml's `install` job on every
# pull request. Nothing here downloads a GitHub Release asset by constructed name,
# so there is no asset-naming contract that could rot unnoticed between releases.
#
# Deliberately cheap: a checkout, the language runtime that owns the installer,
# `pip install` / `npm install -g`, and bash. No Rust toolchain, no build, no cache
# — a sweep that took ten minutes a platform would be the first thing switched off,
# and this one has to keep running while nobody is looking.
#
# A failure here has nowhere of its own to appear: there is no pull request to
# turn red and nobody waiting on the run. So the `report` job below files it,
# through `scripts/report-workflow-failure.sh` — one open issue, commented on at
# each further failure. Without it this sweep detected a live npm publication
# defect for months and told no one, which is what a red square in a tab nobody
# opens is worth.
#
# NOT a required check, and it cannot become one: branch protection lists contexts
# a *pull request* reports, and nothing here runs on one. See AGENTS.md.
#
# llmlint: ignore-file[changed_behavior_has_e2e] this workflow is a trigger, two registry
# installs, and calls to two committed scripts. The scripts are what hold the behaviour,
# and both are driven for real: scripts/smoke-published.sh by
# crates/onevcs/tests/e2e/smoke.rs over the compiled binary, and
# scripts/report-workflow-failure.sh by crates/onevcs/tests/e2e/scripts.rs over both of
# its create-or-comment branches — same files, same assertions. What is left here is the
# trigger and the two installs, which only a hosted runner and a live registry can
# exercise; simulating either would put the simulation under test.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] the smoke legs need no
# credential: every step reads a public registry anonymously, and the jobs are switched by
# the same PYPI_PUBLISH / NPM_PUBLISH repository variables that decide whether this
# project publishes to those registries at all. A repo that publishes nowhere has nothing
# to smoke, and a red run for an absent package is how a sweep gets switched off. The one
# credential here is the job-scoped GITHUB_TOKEN the `report` job files an issue with,
# which is issued to the run rather than provisioned, so there is nothing for a leg to
# refuse the absence of.

on:
  # Every completion of this repository's release workflow. That is precisely when
  # the registries' answer can have just become wrong, so the sweep asks then
  # rather than on a timer that cannot know — the difference between a publication
  # defect found in minutes and one found whenever the timer next came round.
  #
  # Not filtered on `release.yml` having succeeded, on purpose: a release that
  # failed part-way is the *likeliest* producer of the defect this exists to catch.
  # A dist-tag pointing at a build that never shipped is exactly what a publish
  # that stopped between its steps leaves behind.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # The manual entry point — after a registry incident, or to confirm a fix
  # without waiting for the next release.
  workflow_dispatch:

# Nothing by default. The smoke jobs ask for `contents: read` because they check
# out the smoke script and read public registries anonymously; only `report` may
# write, and only issues.
permissions: {}

concurrency:
  group: published-smoke
  cancel-in-progress: false

jobs:
  # `pip install onevcs-cli`, on each OS, as a user runs it.
  pypi:
    name: pypi (${{ matrix.os }})
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      # Every platform reports: the first red leg must not hide a second.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # main's script, on purpose: this sweep asks whether the *current*
      # definition of "it works" still describes what the registry serves.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the latest published wheel
        id: install
        run: |
          if ! pip install --upgrade onevcs-cli; then
            echo "::error::PyPI on $RUNNER_OS/$RUNNER_ARCH: pip install onevcs-cli failed"
            echo "ACTION: check https://pypi.org/project/onevcs-cli/ for a yanked or missing wheel for this platform" >&2
            exit 1
          fi
          version="$(pip show onevcs-cli | sed -n 's/^Version: //p' | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::PyPI on $RUNNER_OS/$RUNNER_ARCH: onevcs-cli installed but reports no version"
            echo "ACTION: inspect the wheel's metadata — pip show found no Version field" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The registry's version against the binary's own: a wheel whose metadata
      # says one thing and whose payload is another installs and runs perfectly.
      - name: Smoke-test what PyPI served
        env:
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          bash scripts/smoke-published.sh \
            --expect-version "$VERSION" \
            --label "PyPI onevcs-cli $VERSION on $RUNNER_OS/$RUNNER_ARCH"

  # `npm install -g onevcs-cli`, on each OS, as a user runs it.
  npm:
    name: npm (${{ matrix.os }})
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the latest published package
        id: install
        run: |
          version="$(npm view onevcs-cli version 2>/dev/null | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::npm on $RUNNER_OS/$RUNNER_ARCH: the registry serves no version of onevcs-cli"
            echo "ACTION: check https://www.npmjs.com/package/onevcs-cli — the latest dist-tag may be unset or the package unpublished" >&2
            exit 1
          fi
          # Pinned to what `npm view` just reported so the version asserted below is
          # the one that was installed, even if latest moves mid-run. That pin is
          # also why this install retries: `npm view` and the install resolve
          # independently, so a version published minutes ago can be on the edge one
          # read and not the other.
          bash scripts/retry-install.sh \
            --label "npm onevcs-cli $version on $RUNNER_OS/$RUNNER_ARCH" \
            --action "the platform package for this runner is missing or unpublished; check the onevcs-cli-* packages" \
            -- npm install -g --prefer-online "onevcs-cli@${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Smoke-test what npm served
        env:
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          bash scripts/smoke-published.sh \
            --expect-version "$VERSION" \
            --label "npm onevcs-cli $VERSION on $RUNNER_OS/$RUNNER_ARCH"

  # Somewhere for a failure to be seen. Neither trigger above reports into a pull
  # request, so a red leg announces itself nowhere unless this job files it — and
  # what it is announcing is that what users install right now is broken.
  #
  # One issue, commented on at each further failure, so a bad release followed by
  # a bad fix is one thread rather than a pile of issues nobody reads. The
  # create-or-comment decision lives in the committed script, not here, because it
  # is real behaviour with two branches: crates/onevcs/tests/e2e/scripts.rs drives
  # both of them.
  report:
    name: report
    # `failure()` and not `always()`: every smoke leg green has nothing to file,
    # and both smoke jobs *skipped* — the state of a repository that publishes to
    # neither registry — is not a failure either.
    if: ${{ failure() }}
    needs: [pypi, npm]
    permissions:
      # The checkout below is why the script this runs is in the workspace at all;
      # issues are the only thing this workflow writes, and only from here.
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: File the failure where somebody will see it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Constant, because it is also how the script finds the thread it
          # already opened. Editing it starts a new one.
          TITLE: "Published smoke is failing"
          BODY: |
            `published-smoke` failed: what PyPI and npm are serving as `latest`
            right now does not install and behave the way the shipped artifact
            must. Nothing else in this repository installs from a registry between
            releases, so this is the only place that break shows up before a user
            hits it.

            ACTION: open the run below and read the red leg — it names the
            registry, the platform, and the version the registry claims, and the
            `ACTION:` line under its `::error::` says what to do about that
            particular break. A release that stopped part-way is the usual cause,
            and re-cutting it is the usual fix.

            Triggered by: ${{ github.event.workflow_run.html_url || 'a manual dispatch' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-workflow-failure.sh
