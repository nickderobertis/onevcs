name: CI

# Releases batch: release-plz accumulates every merge to main behind one release
# pull request, so the commit that ships is that PR's, and no merge job swept it.
# So every build here — a pull request, a push to main — runs the affected tier
# against an explicitly derived base, and the release PR alone gets the full
# `run-many` sweep, once, in the `sweep` job. scripts/ci-tier.sh is the one place
# that tells the two apart. The live tier is not here at all: smoke.yml.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which projects this build's diff can reach, derived once so every
  # Rust-artifact job below can skip on a change that cannot touch a Rust project
  # (the crate or any test tier split out of it) instead of paying the full
  # matrix. A pull request's base is its merge base; a push to main's is the
  # commit the push replaced. It also says which gate tier this commit owes, for
  # the `sweep` job.
  #
  # `just affected-rust` fails closed: with no derivable merge base — a shallow
  # clone, a missing base branch — it says a Rust project is affected and the matrices
  # run. Affected selection is a speed optimisation, and one that can silently
  # skip a check is a correctness hole.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` needs the merge base, which a shallow checkout does not
          # have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install through crates.io, not the GitHub release-download path used by
      # setup-just/install-action. That path can be down without blocking a gate.
      - uses: ./.github/actions/setup-just
      - name: Which projects the diff reaches
        id: affected
        env:
          ONEVCS_NX_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: echo "rust=$(just affected-rust)" >> "$GITHUB_OUTPUT"
      - name: Which gate tier this commit owes
        id: tier
        run: echo "tier=$(just ci-tier select)" >> "$GITHUB_OUTPUT"

  # The gate on a clean checkout: bootstrap from scratch, then the deterministic
  # gate (format, clippy, every test tier, the coverage threshold over their
  # union, docs) over the projects this build's diff reaches — keyed to the merge
  # base on a pull request and to the commit the push replaced on main. With no
  # base it can derive, `just check-affected` runs every project instead.
  #
  # Linux-only because coverage is measured here; macOS/Windows prove the artifact
  # via the `cross` job below.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      - uses: ./.github/actions/setup-just
      # `just bootstrap` provisions everything this job runs on, `fuse3` included —
      # one sweep journey mounts a filesystem of its own through `fusermount3`, and
      # declaring it there rather than as a step here is what keeps a clean clone and
      # this runner set up through the same command.
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (affected projects)
        env:
          ONEVCS_NX_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: just check-affected
      # A committed lockfile that `just bootstrap`/`just check` had to change is a
      # stale generated file; fail rather than let it drift.
      - name: Committed generated files are up to date
        run: git diff --exit-code -- Cargo.lock package-lock.json

  # Prove the artifact builds and its tests pass on macOS and Windows (without the
  # coverage threshold, which is enforced on Linux).
  cross:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: ./.github/actions/setup-just
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (format, lint, every offline tier)
        run: just check-quick

  # The declared MSRV is a promise to consumers, so prove it rather than document
  # it: a floor that only lives in Cargo.toml drifts the first time a dependency
  # raises its own.
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `just msrv` runs through the Nx graph, whose wrapper installs the pinned Nx.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-just
      # `just msrv` reads the same `rust-version` field, so the recipe and the job
      # can never disagree about which floor was proven.
      - run: just msrv

  # The tree a release PR carries is made on a push to main, by release-plz.yml,
  # after every check here has passed on the pull request — so a change that leaves
  # that tree unable to bootstrap is otherwise found on the release PR, where #242
  # found the stale compat/Cargo.lock. This cuts one offline with `release-plz
  # update` and bootstraps it. Not gated on `changes`: release-plz.toml, the
  # workflow, and compat/ are all outside the crate project and can each break it.
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release baseline is the latest `v*` tag, as release-plz.yml reads it.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      # `just release-pr-journeys` runs through the Nx graph.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The version the release job runs, read from where it is pinned rather than
      # pinned a second time here.
      - name: Read the release-plz pin
        id: pin
        run: |
          version="$(sed -n 's/^ *RELEASE_PLZ_VERSION: *"\([^"]*\)".*/\1/p' .github/workflows/release-plz.yml)"
          [ -n "$version" ] || { echo "::error::release-plz.yml pins no RELEASE_PLZ_VERSION"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          # The rest is what the cut tree's `just _crate-bootstrap` would otherwise
          # compile from source.
          tool: release-plz@${{ steps.pin.outputs.version }},nextest,cargo-llvm-cov
      - uses: ./.github/actions/setup-just
      - run: just release-pr-check
      # What release-pr-check proves, held by journeys against the same release-plz.
      - run: just release-pr-journeys

  # Advisory + license audit and unused-dependency check. Its own Linux-only job:
  # it needs a network advisory DB and must not be duplicated across the matrix.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      # `just deps-check` runs through the Nx graph.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-just
      - run: just deps-check

  # The broader tier: one `run-many` sweep of every project's `check`, on
  # release-plz's release pull request alone. Releases batch behind that PR, so its
  # commit is the one that ships and no merge job swept it; every other build runs
  # the affected tier in `gate`. `changes` asks scripts/ci-tier.sh which tier this
  # commit owes, and this job runs the answer through the same script.
  #
  # Not a required context: nothing required `needs` it, and an ordinary pull
  # request never schedules it.
  sweep:
    needs: changes
    if: needs.changes.outputs.tier == 'sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      - uses: ./.github/actions/setup-just
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (every project)
        run: just ci-tier run -t check

  # Prove the end-user install path on every platform: install the binary the
  # documented way and smoke-test the real artifact with the same script the
  # release verify jobs run against PyPI and npm. `cargo install --path` is the
  # same code path as the documented `cargo install onevcs`, minus the registry
  # fetch — so the path users take is exercised on every PR, not only after a
  # release.
  install:
    needs: [changes, gate]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # On a PR the change is not on the remote yet, so `--path` is the only way to
      # install *this* revision.
      - name: Install (this revision)
        run: cargo install --path crates/onevcs --locked
      - name: Smoke-test the installed binary
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/onevcs/Cargo.toml | head -n1)"
          bash scripts/smoke-published.sh \
            --expect-version "$version" \
            --label "cargo install onevcs $version on $RUNNER_OS/$RUNNER_ARCH"

  # The README's install one-liner, run verbatim. It can only resolve code that is
  # already on the remote, so it runs on main rather than on PRs — where the
  # `install` job above proves the same path against the branch's own revision.
  install-documented:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: Swatinem/rust-cache@v2
      # Named explicitly: the repository root is a virtual workspace manifest, so
      # `cargo install --git` has to be told which package to build.
      - name: Install (the command the README gives users)
        run: cargo install --git https://github.com/nickderobertis/onevcs onevcs --locked
      - name: Smoke-test the installed binary
        run: |
          onevcs --version
          onevcs --help >/dev/null

  # Lint the PR title: under squash-merge it becomes the release-driving commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The LLM-judge tier: a blocking PR check, separate from the deterministic
  # `check` gate. It requires its harness credential and fails fast without it — a
  # credential-less no-op would report unlinted files as clean. Fork PRs are gated
  # by the repo's require-approval-for-fork-workflows setting.
  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-just
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # oneharness.toml's primary harness. Without a harness binary on PATH,
      # llmlint has nothing to drive and the job would fail with no findings —
      # which reads like a clean run. Pinned rather than floating: an upstream
      # release has taken this required check down before. Bump deliberately.
      - name: Install the Codex harness
        run: npm install -g @openai/codex@0.145.0
      # oneharness only falls through to a harness it can actually spawn, so the
      # secondary in the chain is a resilience claim the runner cannot honour
      # unless `claude` is on PATH too. With it installed, an exhausted or broken
      # codex degrades to claude-code instead of failing the check.
      - name: Install the Claude Code harness (oneharness fallback)
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: Install llmlint toolchain
        run: just setup-llmlint
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          # The fallback is only real if its credential arrived too: without it
          # claude-code is rejected at auth and falls through, leaving the chain
          # nowhere to degrade to — the same failure, but silent, because an
          # installed-yet-uncredentialled harness looks fine.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs CLAUDE_CODE_OAUTH_TOKEN for the claude-code fallback harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
