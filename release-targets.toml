# The release targets of this repository: what a consumer can wait on, and the
# only identifiers scripts/release-probe.sh will answer for.
#
# The schema is the canonical one in docs/contract.md, which six repositories
# write against; `onevcs release declaration .` reads this file through the same
# reader a consumer does, and the gate holds this document to it.
#
# **The registry qualification is load-bearing rather than decorative.**
# `onevcs-cli` is both a PyPI project and an npm package, published from this one
# repository on two cadences, so an unqualified `onevcs-cli` names two different
# artifacts and a consumer waiting on it cannot say which one it got. Every `id`
# here is therefore `<registry>:<name>`, where the name is exactly the name that
# registry serves.
#
# A target is a **consumable** artifact — one a dependent names in order to depend
# on it. The five per-platform npm packages (`onevcs-cli-<platform>-<arch>`) are
# not targets of their own: they exist only so the `onevcs-cli` launcher can
# resolve one at its own exact version, they are named by nobody else, and
# `npm:onevcs-cli` is the wait that covers them. That is what the `covers` list on
# that target says, and `every_per_platform_npm_package_is_covered_by_the_launcher_target`
# in crates/onevcs/tests/contract.rs holds the list to the launcher's own pins.
#
# What this document deliberately does not name is the GitHub Release archive. It
# is a direct download rather than a registry artifact — there is no registry that
# serves it, and so no `<registry>:<name>` identifier for it — and what it ships is
# already held to this repository by
# `every_file_a_release_archive_names_is_in_this_repository` in
# crates/onevcs/tests/contract.rs. It is not a `[[retired]]` entry either: that
# records something this repository once published and does not any more, and the
# archive is published on every release.
#
# `the_declared_release_targets_are_exactly_what_this_repository_publishes`, in
# that same suite, reconciles this document with the *real* release configuration —
# .github/workflows/release.yml, pyproject.toml, and npm/onevcs/package.json — in
# both directions, so a name this repository starts publishing fails the gate
# rather than going undeclared, and a target declared here for something it does
# not publish fails it too.

# `schema_version` is what this document states about its own shape, not a second
# gate its identifiers are put through. `2` is the shape a producer writes today;
# what it moved is which identifiers a `target.id` or a `covers` entry may express —
# npm's scoped `@scope/name` — and no key at all, so a consumer still reading
# version 1 reads this document as the shape it knows and loses nothing, because
# nothing here is spelled scoped.

schema_version = 2
probe = "scripts/release-probe.sh"

# The library and the `onevcs` binary. Its version is the one version source for
# everything packaged from this repository — the wheel takes it through maturin's
# `dynamic = ["version"]`, and the npm packages through scripts/npm-build.mjs.
[[target]]
id = "crate:onevcs"
name = "crate"
what = "The library and the `onevcs` binary, as a Rust dependent takes them."
published_by = ".github/workflows/release.yml — the publish-crate job, first of the two names it passes scripts/publish-crates.sh, under crates/onevcs/Cargo.toml's [package] name."
manifest = "crates/onevcs/Cargo.toml"

# The in-memory and file-backed `Vcs` and `RemoteHost` implementations a consumer
# puts in dev-dependencies. It versions and tags on its own cadence — a change to a
# test provider must not bump the CLI everyone installs — so it is a wait of its
# own rather than something `crate:onevcs` covers.
[[target]]
id = "crate:onevcs-testing"
name = "testing-crate"
what = "The in-memory and file-backed Vcs and RemoteHost implementations, for a consumer's dev-dependencies."
published_by = ".github/workflows/release.yml — the publish-crate job, second of the two names it passes scripts/publish-crates.sh, under crates/onevcs-testing/Cargo.toml's [package] name."
manifest = "crates/onevcs-testing/Cargo.toml"

# The wheels, whose project name is the one in pyproject.toml: the upload step
# names nothing, because it publishes whatever the wheels declare.
[[target]]
id = "pypi:onevcs-cli"
name = "pypi"
what = "The `onevcs` binary as a wheel, installable with pip or uv."
published_by = ".github/workflows/release.yml — the publish-pypi job, under pyproject.toml's [project] name."
manifest = "pyproject.toml"

# The launcher an `npm install onevcs-cli` resolves, published last, after the five
# per-platform packages it pins at its own exact version.
[[target]]
id = "npm:onevcs-cli"
name = "npm"
what = "The `onevcs` binary as an npm-installable launcher."
published_by = ".github/workflows/release.yml — the publish-npm job, under npm/onevcs/package.json's name."
manifest = "npm/onevcs/package.json"
covers = [
    "npm:onevcs-cli-linux-x64",
    "npm:onevcs-cli-linux-arm64",
    "npm:onevcs-cli-darwin-x64",
    "npm:onevcs-cli-darwin-arm64",
    "npm:onevcs-cli-win32-x64",
]
