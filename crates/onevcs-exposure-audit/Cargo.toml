[package]
name = "onevcs-exposure-audit"
# A measurement spike's command, never published: it lives on a preserved branch so
# the plan that ordered it can re-run it, and nothing installs it.
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read-only audit of what an account's public repositories and boards expose about its private ones, with the measurements a boundary check is sized from."

[[bin]]
name = "onevcs-exposure-audit"
path = "src/main.rs"

[dependencies]
aho-corasick = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
