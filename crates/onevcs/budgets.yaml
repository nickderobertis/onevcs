# The onevcs crate's own feature budgets, checked by its `budgets` target beside the
# repository's root file. Each one reads a record a journey on the release-binary tier
# (the `onevcs-recovery` project) wrote, and measures nothing itself.
schema_version: 1
budgets:
  - id: public-boundary-check-latency
    measure: reported
    command: [node, ../../scripts/boundary-check-budget.mjs]
    unit: seconds
    direction: max
    threshold: 0.5
    description: >-
      Wall time of one complete publication term check, as the release binary times it
      from inside: deriving a 20-repository term scope (100 terms each) from committed
      manifests and declarations, diffing the outgoing commits against every parent,
      building the matcher and matching 10 MiB across 1,000 paths plus message, branch,
      title and body. Detail, unbudgeted: the phases, the check process's peak resident
      memory, and one export of the same files.
  # Basis: estimate (from public-boundary-check-latency's 0.5 s for deriving the same
  # 20-repository scope and matching 10 MiB in process; a 64 KiB input matches in well
  # under a millisecond, so derivation and process start dominate, and 0.1 s is allowed
  # for process start and the level reads). Measurement source: telemetry, the record
  # the onevcs-recovery journey `boundary_sanitize.rs` writes. Check runtime: about 1
  # second.
  - id: public-boundary-sanitize-latency
    measure: reported
    command: [node, scripts/boundary-sanitize-budget.mjs]
    unit: seconds
    direction: max
    threshold: 0.6
    description: >-
      Wall time of one `onevcs boundary sanitize` process, spawned and awaited as a
      plan-store write's policy call is, from spawn to exit, over one screened write as
      the largest real ones are: a 64 KiB body (GitHub's issue-body ceiling) plus 40
      metadata entries holding 30 replaceable hits, a 20-repository private scope at 100
      terms each, and three level files above the checkouts (one ancestor, the home
      directory, the $ONEVCS_HOME fallback) declaring 10 replacements, on a warm
      filesystem cache. Inner measure: a screened write's whole wall time is dominated by
      the backend's own write request, which differs per backend; the sanitise call is the
      only part of it this change adds. Detail, unbudgeted: its phases (term derivation and
      level-file reads, matcher build, the replacement pass, the re-match), the same input
      through `boundary check`, and the process's peak resident memory.
  # Basis: design (the manager's rulings: a non-empty head_activity answer reused for
  # 300 s; at most 26). Measurement source: telemetry, the record the onevcs-recovery
  # journey `draft_hold.rs` writes. Check runtime: about 2 seconds.
  - id: draft-early-lift-added-host-requests
    measure: reported
    command: [node, scripts/draft-early-lift-budget.mjs]
    unit: requests
    direction: max
    threshold: 26
    description: >-
      GitHub API requests one draft publication's watch spends on the head-activity read
      across the whole watch, before and after any early lift, taking the worst of four
      workloads: one change-auto draft at the default 3,600-second check wait, 30-second
      poll (120 polls) and 120-second grace window, on a repository shaped like crozier's
      CI (required aggregate `gate` gated by needs: on five non-required jobs, plus
      required `commitlint` and `llmlint`) — (i) needs-gated, the aggregate absent while
      its prerequisites run and in the gap before its check run; (ii) two-phase, a
      required check skipped on the draft and work in progress with no incomplete check
      run from the grace window, one empty answer that lifts it, then no post-lift run
      and work in progress again until the bound; (iii) draft-skipping, lifted at the
      grace window; (iv) in progress with no incomplete check run for the whole watch,
      never lifted. Inner measure: the shared token's hourly headroom is the outcome, and
      these are the only requests this change adds. Detail, unbudgeted, per workload:
      polls, check-read requests a poll, the watch's total requests, head-activity reads,
      reads answered from the 300-second reuse, and requests a read.
  # Basis: design (the plan's hourly request allowance). Measurement
  # source: telemetry, the record the onevcs-recovery journey `retire_hour.rs` writes.
  # Check runtime: about 2 seconds.
  - id: retire-hour-host-requests
    measure: reported
    command: [node, scripts/retire-hour-host-requests-budget.mjs]
    unit: requests
    direction: max
    threshold: 760
    description: >-
      GitHub API requests one hour's finished-branch retirement spends — each `gh pr`
      call one GraphQL point, each `gh api` path one REST request, counted from the gh
      stand-in's call ledger and summed over every pass and sweep in the workload
      defined by `tests/recovery-workload/retire_hour.rs`. Inner measure: the shared
      token's hourly headroom (5,000
      requests an hour, GraphQL points and REST each) is the outcome, and these are the
      requests retirement makes in it. Detail, unbudgeted: requests per pass and per
      sweep, branches examined, branches decided from records alone, branches the host
      was asked about, and requests by kind (merged-state view, open list, merge time).

  # Basis: arithmetic over 194.9 MB on eight cores; telemetry from the optimized
  # in-process recovery export journey. Reader runtime: approximately two seconds.
  - id: export-wall-time
    measure: reported
    command: [node, scripts/export-wall-time-budget.mjs]
    unit: seconds
    direction: max
    threshold: 3
    description: >-
      One release-profile export call over 496 files, 194.9 MB, largest 37.1 MB:
      446 JPEG frames with EXIF and XMP, seven G-code, six binary STL, three 3MF
      with PNG thumbnails, 28 JSON, four Markdown, .gitattributes and Python.
      Three opaque patterns; 462 LFS-tracked files into a file-backed store;
      twenty private repositories of 100 terms each. Detail reports phases,
      worker count, paths, raw and decoded bytes, opaque files, LFS objects and
      bytes, peak resident memory and load1.
  # Basis: design: the source local LFS store persists across a refused export
  # and its retry. Telemetry from git-lfs transfer progress, read in two seconds.
  - id: export-source-lfs-download
    measure: reported
    command: [node, scripts/export-source-lfs-download-budget.mjs]
    unit: bytes
    direction: max
    threshold: 0
    description: >-
      Repeated source LFS bytes across two exports of the same realistic 496-file,
      194.9 MB set and 2,000-term private scope. The cold source has its 462
      objects only in origin's file-backed store. Attempt one refuses at an
      unwritable destination endpoint; attempt two lands. Completed git-lfs
      downloads per object, less one copy of each size. Use byte progress when
      available; the file adapter fallback counts the real client's successful
      download-completion trace responses, never queued requests. Detail retains
      each attempt's objects, bytes, progress and trace lines, completion count
      and the counting source.
