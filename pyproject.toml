# PyPI packaging for the onevcs CLI.
#
# maturin's `bin` bindings wrap the prebuilt Rust binary in a per-platform wheel
# (the ruff/uv pattern), so `pip install onevcs-cli` is a seconds-fast binary
# install — the quickest trustworthy path on a CI image with no Rust toolchain, or
# in a restricted-egress network where github.com is blocked but PyPI is
# reachable. The distribution is `onevcs-cli`; the console command it installs is
# `onevcs`, from the `[[bin]]` in crates/onevcs/Cargo.toml.
#
# The version is deliberately NOT set here (`dynamic = ["version"]`): maturin
# sources it from the crate manifest, so release-plz stays the single version
# driver — the same rule scripts/npm-build.mjs follows for the npm packages.
# Wheels are built and published by .github/workflows/release.yml.

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "onevcs-cli"
description = "Version control and remote-host abstraction for agent workflows: host-neutral change requests, sessions, and a rules system."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nick DeRobertis" }]
keywords = ["cli", "git", "github", "vcs", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/nickderobertis/onevcs"
Repository = "https://github.com/nickderobertis/onevcs"

[tool.maturin]
# Package the compiled `onevcs` binary as a wheel entry point, not a Python
# extension module. manifest-path names the binary crate explicitly: the root
# manifest is a virtual workspace, so maturin has nothing to guess from there.
bindings = "bin"
manifest-path = "crates/onevcs/Cargo.toml"
strip = true
